name: Smoke test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    uses: sublimelsp/lsp_smoke_test/.github/workflows/smoke-test.yml@v1
    # Provides the Astro syntax, which Sublime Text doesn't include.
    with:
      extra-packages: |
        SublimeText/Astro@4134-2.10.3
